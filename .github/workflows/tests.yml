name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: Run Pytest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Same commands as the "Running" section of CLAUDE.md
      - name: Create venv and install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          uv venv --python 3.12 screener/.venv
          uv pip install --python screener/.venv -r screener/requirements.lock -r requirements-dev.txt pytest
          screener/.venv/bin/playwright install chromium

      - name: Create venv and install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          uv venv --python 3.12 screener\.venv
          uv pip install --python screener\.venv -r screener\requirements.lock -r requirements-dev.txt pytest
          screener\.venv\Scripts\playwright install chromium

      - name: Run Pytest (Linux)
        if: runner.os == 'Linux'
        run: screener/.venv/bin/python -m pytest tests/ -q

      - name: Run Pytest (Windows)
        if: runner.os == 'Windows'
        run: screener\.venv\Scripts\python -m pytest tests/ -q

  # screener/update.py against the real GitHub on Windows: a folder without .git (as from a ZIP or a
  # copied folder) must become a clean checkout of main with the launcher's CRLF line endings intact.
  # With the HALGOM_DEPLOY_KEY secret (the read-only deploy key) it goes over SSH, as on the end user's PC
  # once the repo is private; without it, anonymous HTTPS (works while the repo is public).
  updater:
    name: Windows Updater Test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv and install dependencies
        run: |
          uv venv --python 3.12 screener\.venv
          uv pip install --python screener\.venv -r screener\requirements.lock

      - name: Turn a copy without .git into a checkout of main
        env:
          HALGOM_DEPLOY_KEY: ${{ secrets.HALGOM_DEPLOY_KEY }}
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "home"
          New-Item -ItemType Directory -Force -Path (Join-Path $home_dir ".halgom") | Out-Null
          if ($env:HALGOM_DEPLOY_KEY) {
              Set-Content -Path (Join-Path $home_dir ".halgom\deploy_key") -Value $env:HALGOM_DEPLOY_KEY -NoNewline
              Write-Host "Using the deploy key (SSH)"
          } else { Write-Host "No deploy key secret: anonymous HTTPS" }
          $env:USERPROFILE = $home_dir; $env:HOME = $home_dir
          $copy = Join-Path $env:RUNNER_TEMP "HalgOM copy"
          git archive --format=zip -o "$env:RUNNER_TEMP\src.zip" HEAD
          Expand-Archive "$env:RUNNER_TEMP\src.zip" -DestinationPath $copy
          screener\.venv\Scripts\python -m screener.update --root $copy
          if ($LASTEXITCODE -ne 3) { Write-Host "expected exit code 3 (updated), got $LASTEXITCODE"; $failed = $true }
          screener\.venv\Scripts\python -m screener.update --root $copy
          if ($LASTEXITCODE -ne 0) { Write-Host "expected exit code 0 (up to date), got $LASTEXITCODE"; $failed = $true }
          Get-Content (Join-Path $copy "screener\_data\logs\update.log")
          $dirty = git -C $copy status --porcelain --untracked-files=no   # the copy is the PR head: its new files are untracked in main
          if ($dirty) { Write-Host "checkout is not clean:"; $dirty; $failed = $true }
          $bat = [IO.File]::ReadAllBytes((Join-Path $copy "run_screener.bat"))
          $lf = ($bat | Where-Object { $_ -eq 10 }).Count
          $crlf = ([Text.Encoding]::ASCII.GetString($bat) -split "`r`n").Count - 1
          if ($lf -ne $crlf) { Write-Host "run_screener.bat lost its CRLF line endings"; $failed = $true }
          if ($failed) { exit 1 }

      # The whole double-click flow in a ZIP folder whose name has a space, "&" and parentheses: the
      # launcher updates (exit 3), restarts itself from its single update line, and the server comes up.
      - name: Double-click flow in a ZIP folder (update, restart, start)
        env:
          STREAMLIT_SERVER_HEADLESS: "true"
          SCREENER_NO_BROWSER: "1"
        run: |
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue   # see the launcher-smoke job
          $copy = Join-Path $env:RUNNER_TEMP "HalgOM & zip (1)"
          Expand-Archive "$env:RUNNER_TEMP\src.zip" -DestinationPath $copy
          $log = Join-Path $env:RUNNER_TEMP "zip_run.log"
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', "run_screener.bat < NUL > `"$log`" 2>&1" `
                 -WorkingDirectory $copy -WindowStyle Hidden -PassThru
          $deadline = (Get-Date).AddMinutes(12)
          $up = $false
          while ((Get-Date) -lt $deadline) {
              try {
                  $r = Invoke-WebRequest -Uri "http://localhost:8501/_stcore/health" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
                  if ($r.Content -eq "ok") { $up = $true; break }
              } catch { }
              if ($p.HasExited) { break }
              Start-Sleep -Seconds 3
          }
          Get-Content $log
          Get-Process -Name python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $up) { Write-Host "server did not come up"; exit 1 }
          if (-not (Select-String -Path $log -Pattern "this folder now updates itself" -Quiet)) {
              Write-Host "the launcher did not run the update"; exit 1
          }
          if (-not (Test-Path (Join-Path $copy ".git"))) { Write-Host "no .git after the update"; exit 1 }

  # Runs the real run_screener.bat on a clean Windows machine, like the end user's first launch.
  # Only the health endpoint is requested: the app page is never opened, so CI sends nothing to TradingView.
  launcher-smoke:
    name: Windows Launcher Smoke Test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SCREENER_NO_UPDATE: "1"           # no git pull in CI
      STREAMLIT_SERVER_HEADLESS: "true" # Streamlit does not open a browser
      SCREENER_NO_BROWSER: "1"          # the second launch does not open a browser either
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start run_screener.bat in the background
        run: |
          # The job shell is pwsh 7, whose PSModulePath breaks Windows PowerShell 5.1 (the launcher's uv
          # install fails with "module could not be loaded"). A double-click starts with a clean env.
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          # stdin from NUL: the launcher's failure path ends with `pause`, which must not hang
          $p = Start-Process -FilePath cmd.exe `
                 -ArgumentList '/c', 'run_screener.bat < NUL > screener_run.log 2>&1' `
                 -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru
          "LAUNCHER_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Launcher started (pid $($p.Id))"

      - name: Wait for server health endpoint
        run: |
          $url = "http://localhost:8501/_stcore/health"
          $deadline = (Get-Date).AddMinutes(15)   # first run installs uv, Python and the packages
          $nextReport = Get-Date
          while ((Get-Date) -lt $deadline) {
              try {
                  $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
                  if ($r.Content -eq "ok") { Write-Host "Server is up and healthy."; exit 0 }
              } catch { }
              # fail fast if the launcher window already closed (it printed why)
              if (-not (Get-Process -Id $env:LAUNCHER_PID -ErrorAction SilentlyContinue)) {
                  Write-Host "run_screener.bat exited before the server came up. Its output:"
                  Get-Content screener_run.log -ErrorAction SilentlyContinue
                  exit 1
              }
              if ((Get-Date) -ge $nextReport) {
                  Write-Host "--- still waiting; last launcher output:"
                  Get-Content screener_run.log -Tail 5 -ErrorAction SilentlyContinue
                  $nextReport = (Get-Date).AddSeconds(60)
              }
              Start-Sleep -Seconds 3
          }
          Write-Host "Server did not answer within 15 minutes. Launcher output:"
          Get-Content screener_run.log -ErrorAction SilentlyContinue
          exit 1

      - name: Run run_screener.bat a second time
        run: |
          # It must find the running server, only "open" it (browser disabled here) and exit 0 by itself
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue   # see the start step
          $p = Start-Process -FilePath cmd.exe `
                 -ArgumentList '/c', 'run_screener.bat < NUL > screener_second_run.log 2>&1' `
                 -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru
          if (-not $p.WaitForExit(60000)) {
              Write-Host "Second run did not exit within 60 seconds."
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              exit 1
          }
          Get-Content screener_second_run.log
          if ($p.ExitCode -ne 0) { Write-Host "Second run exit code: $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Path screener_second_run.log -Pattern "already running" -Quiet)) {
              Write-Host "Second run did not detect the running screener."
              exit 1
          }

      - name: Check health endpoint again
        run: |
          $r = Invoke-WebRequest -Uri "http://localhost:8501/_stcore/health" -UseBasicParsing -TimeoutSec 10
          if ($r.Content -ne "ok") { Write-Host "Health check failed after the second run."; exit 1 }

      - name: Verify a single server
        run: |
          # Count listening processes on the port, not python.exe processes (the venv launcher
          # starts a child interpreter, so one server can show up as two python processes)
          $owners = @(Get-NetTCPConnection -LocalPort 8501 -State Listen -ErrorAction SilentlyContinue |
                      Select-Object -ExpandProperty OwningProcess -Unique)
          Write-Host "Processes listening on 8501: $($owners -join ', ')"
          if ($owners.Count -ne 1) { exit 1 }
          if (Get-NetTCPConnection -LocalPort 8502 -State Listen -ErrorAction SilentlyContinue) {
              Write-Host "A second server is listening on 8502."; exit 1
          }

      - name: Check shortcut flag file
        run: |
          if (-not (Test-Path "screener\_data\shortcut.done")) {
              Write-Host "screener\_data\shortcut.done not found (desktop shortcut step did not run)."
              exit 1
          }

      - name: Stop server
        if: always()
        run: |
          Get-Process -Name python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($env:LAUNCHER_PID) { Stop-Process -Id $env:LAUNCHER_PID -Force -ErrorAction SilentlyContinue }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screener-logs
          path: |
            screener_run.log
            screener_second_run.log
            screener\_data\logs\
          if-no-files-found: ignore
